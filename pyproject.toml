[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ee300148-cpu-cnn"
version = "0.1.0"
description = "CPU-First, AVX2/AVX-512 Optimized CNN & Transfer Learning for EE300148"
readme = "PLAN.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
    "pillow>=9.5.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
